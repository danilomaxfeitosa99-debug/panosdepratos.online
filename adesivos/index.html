<style>
:root{--bg:#120d10;--card:#000;--ink:#fff;--muted:#b9aeb2;--rose:#f29bb5;--btn:#e8527f;--btn2:#ff7aa0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#3a1727 0,#120d10 60%);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.card{position:relative;display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:900px;min-height:620px;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.photo{position:relative;background:#000 url(img/foto.jpg) 42% center/cover no-repeat}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0) 45%,#000 100%)}
.copy{display:flex;flex-direction:column;justify-content:center;padding:44px 40px 44px 8px}
.kicker{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;letter-spacing:.02em;margin-bottom:18px}
.kicker i{display:block;width:44px;height:1px;background:#666}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(40px,6vw,62px);line-height:1.05;font-weight:700;letter-spacing:-.01em}
h1 em{display:block;font-weight:400;color:var(--rose)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:28px;padding:18px 28px;background:var(--btn);color:#1b0a11;border-radius:12px;font-weight:700;font-size:16px;text-decoration:none;box-shadow:0 0 28px rgba(232,82,127,.45);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);background:var(--btn2);box-shadow:0 0 36px rgba(232,82,127,.65)}
.btn svg{width:18px;height:18px;fill:currentColor}
.note{margin-top:14px;text-align:center;font-size:11px;color:var(--muted)}
.links{margin-top:12px;text-align:center;font-size:11px;color:#777}
.links a{color:#8a8a8a;text-decoration:none;padding:0 6px}
.links a:hover{text-decoration:underline}
@media(max-width:640px){
 body{padding:14px;align-items:flex-start}
 .card{grid-template-columns:1fr;min-height:0}
 .photo{height:320px;background-position:50% 0}
 .photo:after{background:linear-gradient(180deg,rgba(0,0,0,0) 50%,#000 100%)}
 .copy{padding:6px 24px 30px}
}
</style>
